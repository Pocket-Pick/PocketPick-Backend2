spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  grpc:
    client:
      channels:
        post-service:
          address: static://${POST_GRPC_HOST}:${POST_GRPC_PORT}
