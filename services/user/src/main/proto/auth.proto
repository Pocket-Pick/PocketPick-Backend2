syntax = "proto3";

import "google/protobuf/empty.proto";

option java_package = "com.flab.pocketpick.user.grpc";
option java_outer_classname = "AuthProto";
option java_multiple_files = true;

service AuthService {
  rpc CreateCredential(CreateCredentialRequest) returns (google.protobuf.Empty);
}

message CreateCredentialRequest {
  string email = 1;
  string password = 2;
}
