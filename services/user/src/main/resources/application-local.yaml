spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_DATABASE:user}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  grpc:
    client:
      channels:
        auth:
          address: ${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9090}
